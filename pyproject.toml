[project]
name = "yt-gui"
version = "0.4.0"
description = "PySide6製のyt-dlp GUIダウンローダー"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "altgraph==0.17.5",
    "macholib==1.16.4",
    "mutagen>=1.48.1",
    "packaging==26.2",
    "pillow>=12.3.0",
    "pycryptodomex>=3.23.0",
    "pyinstaller==6.21.0",
    "pyinstaller-hooks-contrib==2026.6",
    "pyside6>=6.11.0",
    "setuptools==83.0.0",
    "yt-dlp==2026.7.4",
    "yt-dlp-ejs==0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yt_gui"]

[dependency-groups]
dev = [
    "mypy>=2.2.0",
    "pytest>=9.1.1",
    "pytest-cov>=6.0.0",
    "pytest-qt>=4.5.0",
    "ruff>=0.15.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "qt: Qt UI テスト（pytest-qt + QT_QPA_PLATFORM=offscreen が必要。Qt 非導入環境では skip される）",
]

[tool.coverage.run]
source = ["yt_gui"]
omit = [
    "yt_gui/__main__.py",
    "yt_gui/thumbnail_cache.py",
    "yt_gui/locales/*.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# RUF001-003: 全角の句読点・括弧等を「曖昧な Unicode」と誤検知するため恒久除外
# （日本語コメント・docstring が主体のリポジトリでは指摘のほぼ全量が誤検知。#212）
ignore = ["RUF001", "RUF002", "RUF003"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"yt_gui/locales/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
# 検査対象はここで管理する（CI・ローカルとも引数なしの `uv run mypy` で実行。#211）
files = ["yt_gui", "tests", "scripts", "main.py"]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
# 型注釈のない関数本体も検査する（#212）。disallow_untyped_defs は修正量（実測 451 件）
# に対して検出力向上が薄いため見送り（docs/task/lint-strictness.md に記録）
check_untyped_defs = true
warn_unreachable = true
strict_equality = true
warn_unused_ignores = true
