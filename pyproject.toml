[project]
name = "yt-gui"
version = "0.4.0"
description = "PySide6製のyt-dlp GUIダウンローダー"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "altgraph==0.17.5",
    "macholib==1.16.4",
    "mutagen>=1.47.0",
    "packaging==26.2",
    "pillow>=12.2.0",
    "pycryptodomex>=3.23.0",
    "pyinstaller==6.21.0",
    "pyinstaller-hooks-contrib==2026.6",
    "pyside6>=6.11.0",
    "setuptools==82.0.1",
    "yt-dlp==2026.6.9",
    "yt-dlp-ejs==0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["yt_gui"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.0",
    "pytest-cov>=6.0.0",
    "pytest-qt>=4.5.0",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "qt: Qt UI テスト（pytest-qt + QT_QPA_PLATFORM=offscreen が必要。Qt 非導入環境では skip される）",
]

[tool.coverage.run]
source = ["yt_gui"]
omit = [
    "yt_gui/__main__.py",
    "yt_gui/original_format_panel.py",
    "yt_gui/log_dialog.py",
    "yt_gui/thumbnail_cache.py",
    "yt_gui/locales/*.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"yt_gui/locales/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
