[project]
name = "yt-gui"
version = "0.1.0"
description = "PySide6製のyt-dlp GUIダウンローダー"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "altgraph==0.17.5",
    "macholib==1.16.4",
    "mutagen>=1.47.0",
    "packaging==26.2",
    "pillow>=12.2.0",
    "pycryptodomex>=3.23.0",
    "pyinstaller==6.20.0",
    "pyinstaller-hooks-contrib==2026.4",
    "pyside6>=6.11.0",
    "setuptools==82.0.1",
    "yt-dlp==2026.3.17",
    "yt-dlp-ejs==0.8.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "ruff>=0.15.12",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
