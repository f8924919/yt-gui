name: Release

on:
  push:
    branches: [main]
  # ビルド検証専用のドライラン（#272）: タグ・リリースは作成せず、選択した
  # ブランチの HEAD で build マトリクスだけを実行する（tag / release ジョブは
  # push イベント限定）。同梱バイナリ差し替え等のリリース前検証に使う。
  workflow_dispatch:

permissions:
  contents: write          # タグ・リリース作成に必要

concurrency:
  # イベント種別で分離し、ドライランが本番リリースをブロックしないようにする。
  # dispatch はタグ・リリースを作らないため並走しても競合しない（#272）。
  group: release-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  # ① pyproject.toml の version を読み、v{version} タグの有無でリリース要否を判定
  version-gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      should_release: ${{ steps.v.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"   # 既存タグ → 何もしない
            echo "::notice::v$version tag already exists; skipping release."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::New version v$version detected; will tag and release."
          fi

  # ② 新バージョンなら v{version} タグを作成・push（push イベント限定。
  #    workflow_dispatch では version が未リリース値でもタグを作らない）
  tag:
    needs: version-gate
    if: github.event_name == 'push' && needs.version-gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          v="v${{ needs.version-gate.outputs.version }}"
          git tag "$v"
          git push origin "$v"

  # ③ OS マトリックスでビルド（クロスビルド非対応のため各 OS ランナーで実行）
  #    push では tag 成功時のみ（version 据え置き push の no-op 冪等性を維持）、
  #    workflow_dispatch では tag スキップのまま実行する（ドライラン。#272）
  build:
    needs: [version-gate, tag]
    if: >-
      always() && needs.version-gate.result == 'success' &&
      (needs.tag.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && needs.tag.result == 'skipped'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest      # x64
          - os: macos-latest        # Apple Silicon (arm64)
            macos_arch: arm64
          - os: macos-15-intel      # Intel (x86_64)。macos-13 退役後の標準 Intel イメージ
            macos_arch: x86_64
          - os: ubuntu-22.04        # x64（glibc 互換性のため 22.04）
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          # リリース時はタグ付けしたソースを正確にビルド。ドライラン時は実行対象
          # ブランチの HEAD（github.sha）をビルドする（#272）
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || format('v{0}', needs.version-gate.outputs.version) }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true   # 依存キャッシュ（キーは OS・uv.lock から自動生成。#213）
      - run: uv python install 3.14
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y binutils file
      - run: uv sync
      - name: Download bundled binaries (auto-accept GPL)
        run: uv run python scripts/download_binaries.py --yes   # spec 内の再呼び出しは既存ファイルありでスキップ
      # 同梱 ffmpeg のスモーク（#272）: BtbN linux ビルドが完全静的リンクであること
      # （ldd が "not a dynamic executable"。静的バイナリで ldd は非ゼロ終了するため
      # 出力テキストで判定する）と、実行・実変換 1 本を確認する。AppImage には
      # 同一バイトが同梱されるため、これで配布物内の ffmpeg の動作を担保する。
      - name: Smoke test bundled ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          ls -l bin/ffmpeg/
          out=$(ldd bin/ffmpeg/ffmpeg 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "not a dynamic executable"
          bin/ffmpeg/ffmpeg -version
          bin/ffmpeg/ffprobe -version
          bin/ffmpeg/ffmpeg -f lavfi -i sine=frequency=440:duration=1 -c:a libmp3lame /tmp/smoke.mp3
      - run: uv run pyinstaller yt-gui.spec
      # --- OS ごとに成果物を 1 ファイルへ ---
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/yt-gui/* -DestinationPath "yt-gui-${{ needs.version-gate.outputs.version }}-windows-x64.zip"
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/yt-gui.app "yt-gui-${{ needs.version-gate.outputs.version }}-macos-${{ matrix.macos_arch }}.zip"
      # Linux は dist/yt-gui-{version}-x86_64.AppImage がそのまま成果物
      # ブラウザ拡張は OS 非依存のため Linux ランナーで一度だけ zip 化する。
      # version を pyproject に同期してから固め、配布物をアプリ本体と一致させる。
      - name: Package browser extension
        if: runner.os == 'Linux'
        run: |
          uv run python scripts/sync_extension_version.py
          (cd extension && zip -r "../yt-gui-extension-${{ needs.version-gate.outputs.version }}.zip" . -x '*.DS_Store')
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.os }}
          path: |
            *.zip
            dist/*.AppImage
          if-no-files-found: error
          # 同一実行内の release ジョブへ橋渡しするだけの中間成果物。配布物は Release
          # アセットに残るため、ストレージ枠を圧迫しないよう短期で自動失効させる。
          retention-days: 1

  # ④ 成果物を集約し、来歴署名（SLSA provenance）を付与して GitHub Release を作成
  #    push イベント限定（workflow_dispatch のドライランでは Release を作らない）
  release:
    needs: [version-gate, build]
    if: github.event_name == 'push' && needs.version-gate.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    # 既定の contents:write に加え、Sigstore キーレス署名（OIDC）と attestation 書き込みを許可
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true
      # 配布する成果物（zip / AppImage）に来歴署名を付与する。
      # 公開する物と同一バイトを subject にするため、Release 作成の直前に実施する。
      # 検証: gh attestation verify <file> --repo ${{ github.repository }}
      # actions/attest-build-provenance は個人所有の private リポジトリでは利用できず
      # 失敗するため、private のときはスキップする（public 化すれば自動で有効化される）。
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            assets/**/*.zip
            assets/**/*.AppImage
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 成果物はアーティファクトによっては dist/ などの階層付きで展開されるため、
          # ディレクトリではなくファイルだけを収集して添付する（assets/* だとディレクトリを掴む）。
          mapfile -t files < <(find assets -type f)
          gh release create "v${{ needs.version-gate.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --title "v${{ needs.version-gate.outputs.version }}" \
            --generate-notes \
            "${files[@]}"
