# Dependabot による依存更新の自動 PR。
# - github-actions: ワークフローで参照する action のバージョン追従（サプライチェーン対策）
# - uv: pyproject.toml / uv.lock の Python 依存の更新
# 詳細: https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
