<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title data-i18n="optionsTitle">yt-gui Connector Settings</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 16px;
        max-width: 480px;
        font-size: 14px;
      }
      h1 {
        font-size: 16px;
      }
      label {
        display: block;
        margin-top: 12px;
        font-weight: bold;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px;
        margin-top: 4px;
      }
      input[type="number"] {
        width: 120px;
      }
      button {
        margin-top: 16px;
        padding: 6px 16px;
      }
      .note {
        color: #666;
        margin-top: 8px;
        line-height: 1.5;
      }
      #status {
        margin-top: 12px;
        color: #2e7d32;
        min-height: 1em;
      }
    </style>
  </head>
  <body>
    <h1 data-i18n="optionsTitle">yt-gui Connector Settings</h1>

    <label for="token" data-i18n="tokenLabel">Token</label>
    <input type="text" id="token" data-i18n-placeholder="tokenPlaceholder" />

    <label for="port" data-i18n="portLabel">Receiving port</label>
    <input type="number" id="port" min="1" max="65535" value="8718" />

    <button id="save" data-i18n="saveButton">Save</button>
    <div id="status"></div>

    <p class="note" data-i18n="note">
      Enable the server under "Settings → Browser integration" in yt-gui and
      paste the token shown there into the field above. Use the same port as
      yt-gui (default 8718). In case yt-gui falls back when the port is busy,
      the extension automatically tries 8718–8720.
    </p>

    <script src="options.js"></script>
  </body>
</html>
